version: 2
# Disable routine version-update PRs. Security-update PRs are managed separately.
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /tools
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
